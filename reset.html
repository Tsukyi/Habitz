{% extends "layout.html" %}

{% block title %}
    Reset Password
{% endblock %}

{% block main %}
    <form action="/reset" method="post">
        <div class="mb-3">
            <p>Enter your username to get a link to reset your password:</p>
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="username" placeholder="Username" type="text">
        </div>
        <button class="btn btn-primary" type="submit">Confirm Reset</button>
    </form>
{% endblock %}
