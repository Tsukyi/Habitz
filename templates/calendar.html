{% extends "layout.html" %}

{% block title %}Login Calendar{% endblock %}

{% block main %}
<h2>Login Calendar</h2>
<p class="text-muted mb-0">Track your login activity over the past 30 days.</p>

<div class="calendar-grid">
    {% for day in days|reverse %}
        <div class="day {% if day in login_dates %}active{% endif %}" title="{{ day }}"></div>
    {% endfor %}
</div>
<br>
<p>You have been active for <b class="active">{{ login_count }} days!</b></p>

<style>
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 50px);
    gap: 12px;
    margin-top: 40px;
    justify-content: center;
}

.day {
    width: 50px;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #ebedf0;
    border-radius: 8px;
    transition: transform 0.2s;
}

.day.active {
    background-color: #ff6b00;
    box-shadow: 0 0 8px #ff6b00;
}

.day.active:hover {
    transform: scale(1.2);
}
</style>
{% endblock %}
